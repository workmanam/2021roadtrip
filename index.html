<!DOCTYPE html>
<html>

<head>
	<meta charset=utf-8 />
	<title>Summer 2021 Roadtrip</title>
	<meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.css" />
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.0.1/dist/leaflet.css" />
	<link href="https://fonts.googleapis.com/css?family=Noto+Sans" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css?family=Lora" rel="stylesheet">

	<style>
		body {
			margin: 0;
			padding: 0;
			background: "whitesmoke";
			font-family: "Noto Sans", sans-serif;
			color: #3d3d3d;
		}

		h1 {
			position: absolute;
			margin-top: 0;
			top: 10px;
			left: 45px;
			font-size: 2em;
			font-family: "Lora", serif;
			letter-spacing: .04em;
			padding: 10px 15px;
			background: rgba(256, 256, 256);
			border: 1px solid grey;
			border-radius: 3px;
			z-index: 800;
		}

		h2 {
			font-family: "Lora", serif;
			letter-spacing: .04em;
		}

		#map {
			position: absolute;
			top: 0;
			bottom: 0;
			width: 100%;
		}

		section {
			position: absolute;
			bottom: 0;
			left: 10px;
			width: 280px;
			margin: 20px auto;
			padding: 0 15px;
			background: rgba(256, 256, 256);
			border: 1px solid grey;
			border-radius: 3px;
			z-index: 800;
		}

		p {
			font-size: .9em;
			line-height: 1.5em;
		}

		a {
			color: #005daa;
			text-decoration: none;
		}

		a:hover {
			text-decoration: underline;
		}
	</style>
</head>

<body>

	<h1>Summer 2021 Roadtrip</h1>

	<div id='map'></div>

	<section>
		<h2>Roadtrip</h2>

		<p>Points of interest from a summer 2021 roadtrip from North Carolina to Arizona and back.</p>

		<p>Hover over a point for more information.</p>

		<p>Map authored by <a href="https://github.com/workmanam">Aidan Workman</a></p>

	</section>

	<script src="http://code.jquery.com/jquery-3.1.1.min.js"></script>
	<script src="https://unpkg.com/leaflet@1.0.1/dist/leaflet.js"></script>

	<!-- connect geojson to code-->
	<script src="data/route.js"></script>

	<script>

//options to be used when creating the map
		var options = {
			center: [36.08403, -81.83015],
			zoom: 15
		}

//creation of the Leaflet map
		var map = L.map('map', options);

//request to load basemap
var OpenStreetMap_DE = L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
	maxZoom: 18,
	attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors; Map Author: Aidan Workman'
}).addTo(map);


var myRoute = L.geoJson(data, {
	filter: function(feature) {
		if(feature.geometry.type == "LineString") {
			return feature;
		}
	},
	style: function(feature) {
		return {
			color: "maroon",
			weight: 5,
			opacity: 0.75,
			dashArray: "5, 10"
		}
	}
}).addTo(map);
map.fitBounds(myRoute.getBounds());

var myStops = L.geoJson(data, {
	filter: function(feature) {
		if(feature.geometry.type == "Point") {
			return feature;

		}
	},
	onEachFeature: function(feature, layer) {
    layer.bindTooltip(
        feature.properties['Place'] + "<br>" +
        feature.properties['Location'] + "<br>" +
        "<img src='data/img/" + feature.properties['image'] + "' width='200'>"
    );
}
}).addTo(map);
	</script>

</body>

</html>
